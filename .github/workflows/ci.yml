# Every push and pull request: install, build, and package. Windows stops at the unpacked app; macOS
# builds a real .dmg, launches it for a smoke test, and keeps it as a workflow artifact for 14 days.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win --x64 --dir --publish never

      - name: Bundled tools are unpacked
        shell: pwsh
        run: |
          $r = 'dist/win-unpacked/resources'
          foreach ($f in "$r/app.asar.unpacked/node_modules/ffmpeg-ffprobe-static/ffmpeg.exe",
                         "$r/app.asar.unpacked/node_modules/ffmpeg-ffprobe-static/ffprobe.exe",
                         "$r/app.asar.unpacked/node_modules/@deno/win32-x64/deno.exe",
                         "$r/THIRD_PARTY_NOTICES.txt") {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }
          'Packaged app contains ffmpeg, ffprobe, deno and notices.'

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Installs this runner's own ffmpeg, ffprobe and deno binaries (darwin-arm64 or darwin-x64).
      - run: npm ci
      - run: npx electron-vite build

      # Ad-hoc signed ("-"): enough for macOS to run it. Not a Developer ID signature, so Gatekeeper
      # still asks people to approve it on first open. Hardened runtime is for notarized builds only;
      # with an ad-hoc signature its library validation can stop the app from launching.
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Bundled tools run
        run: |
          app="$(ls -d dist/mac*/IV\ Downloader.app)"
          u="$app/Contents/Resources/app.asar.unpacked/node_modules"
          "$u/ffmpeg-ffprobe-static/ffmpeg" -hide_banner -version | head -3
          "$u/ffmpeg-ffprobe-static/ffprobe" -hide_banner -version | head -1
          "$u/@deno/darwin-${{ matrix.arch }}/deno" --version | head -1
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.txt"
          find "$app" -maxdepth 3 -iname '*licen*' -print
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|flags'
          lipo -archs "$app/Contents/MacOS/IV Downloader"

      - name: Smoke test the packaged app
        run: node scripts/smoke-test.mjs "$(ls -d dist/mac*/IV\ Downloader.app)/Contents/MacOS/IV Downloader" smoke-${{ matrix.arch }}.png

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: IV-Downloader-mac-${{ matrix.arch }}
          path: |
            dist/IV-Downloader-mac-${{ matrix.arch }}.dmg
            smoke-${{ matrix.arch }}.png
          retention-days: 14
